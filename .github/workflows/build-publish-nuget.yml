name: Build and Publish NuGet

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Building never publishes. Every push and pull request restores and builds the
# library project. A package is packed and pushed to GitHub Packages only by
# pushing a tag `v<Version>` that matches the <Version> in src/Primify/Primify.csproj.
# Nothing here restores from GitHub Packages: every package dependency lives on nuget.org.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore library project
        run: dotnet restore src/Primify/Primify.csproj

      - name: Audit packages for known vulnerabilities
        run: dotnet list src/Primify/Primify.csproj package --vulnerable --include-transitive

      - name: Build library project
        run: dotnet build src/Primify/Primify.csproj --configuration Release --no-restore -p:GeneratePackageOnBuild=false

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify the tag matches the package version
        id: extract_version
        run: |
          VERSION=$(grep '<Version>' src/Primify/Primify.csproj | sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract <Version> from src/Primify/Primify.csproj"
            exit 1
          fi
          if [ "v${VERSION}" != "${GITHUB_REF#refs/tags/}" ]; then
            echo "::error::Tag '${GITHUB_REF#refs/tags/}' does not match <Version> '$VERSION' in src/Primify/Primify.csproj. Bump <Version> or fix the tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag ${GITHUB_REF#refs/tags/} matches <Version> $VERSION."

      - name: Restore library project
        run: dotnet restore src/Primify/Primify.csproj

      # The package is built by pack directly, so GeneratePackageOnBuild is redundant here.
      - name: Pack
        run: dotnet pack src/Primify/Primify.csproj --configuration Release --no-restore --no-build -p:GeneratePackageOnBuild=false -o ./nupkg

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          elif ! gh release create "v$VERSION" --title "Primify $VERSION" --generate-notes; then
            echo "::error::gh release create failed. Check that GITHUB_TOKEN has 'contents: write'."
            exit 1
          fi
