name: Build and Publish NuGet

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Step "Decode Signing Key" REMOVED because we disabled signing.

      - name: Ensure GitHub Packages token
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "Missing GH_PACKAGES_TOKEN (PAT with write:packages). Configure it in repo secrets."
            exit 1
          fi

      - name: Authenticate with GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GH_PACKAGES_TOKEN }} \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Restore solution
        run: dotnet restore Primify.slnx

      - name: Build solution
        run: dotnet build Primify.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet run --project tests/Primify.Tests/Primify.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Primify/Primify.csproj --configuration Release --no-build --output ./nupkg

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source github \
            --api-key ${{ secrets.GH_PACKAGES_TOKEN }} \
            --skip-duplicate
